<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Güncelle | Kampüs Etkinlik</title>
  <link rel="stylesheet" href="2211012053.css">
</head>
<body>
  <header>
    <h1>Kampüs Etkinlik</h1>
    <p>Kampüsteki etkinlikleri keşfet, takip et ve katıl.</p>
  </header>

  <nav>
    <a href="index.html">Ana Sayfa</a>
    <a href="etkinlikler.html">Etkinlikler</a>
    <a href="etkinlik-ekle.html">Etkinlik Ekle</a>
  </nav>

  <main>
    <form id="etkinlik-formu" class="etkinlik-form" novalidate>
      <label for="ad">
        Etkinlik Adı
        <input type="text" id="ad" name="ad" value="Kariyer Günleri" required>
        <span id="name-error" class="hata-mesaji"></span>
      </label>

      <label for="kategori">
        Kategori
        <select id="kategori" name="kategori">
          <option value="Seminer" selected>Seminer</option>
          <option value="Atölye">Atölye</option>
          <option value="Fuar">Fuar</option>
          <option value="Sosyal">Sosyal</option>
          <option value="Söyleşi">Söyleşi</option>
        </select>
        <span id="category-error" class="hata-mesaji"></span>
      </label>

      <label for="tarih">
        Tarih
        <input type="date" id="tarih" name="tarih" value="2026-10-12" required>
        <span id="date-error" class="hata-mesaji"></span>
      </label>

      <label for="saat">
        Saat
        <input type="time" id="saat" name="saat" value="10:00" required>
        <span id="time-error" class="hata-mesaji"></span>
      </label>

      <label for="yer">
        Yer
        <input type="text" id="yer" name="yer" value="Konferans Salonu" required>
        <span id="location-error" class="hata-mesaji"></span>
      </label>

      <label for="kapasite">
        Kapasite
        <input type="number" id="kapasite" name="kapasite" value="300" min="1">
        <span id="capacity-error" class="hata-mesaji"></span>
      </label>

      <label for="aciklama">
        Açıklama
        <textarea id="aciklama" name="aciklama" rows="4">Şirketlerle tanışma fırsatı bulacağınız Kariyer Günleri'nde, staj ve iş fırsatlarını keşfedebilir, sektör temsilcileriyle birebir görüşme imkanı bulabilirsiniz.</textarea>
        <span id="description-error" class="hata-mesaji"></span>
      </label>

      <button type="submit">Kaydet</button>
    </form>
    <div id="form-message"></div>
  </main>

  <footer>
    <p>&copy; 2026 Kampüs Etkinlik. Tüm hakları saklıdır.</p>
  </footer>
  <script type="module" src="js/event-form.js"></script>
</body>
</html>
